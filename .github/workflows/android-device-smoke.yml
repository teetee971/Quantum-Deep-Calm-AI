name: Android Emulator Regression

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-device-regression:
    name: Managed-device regression (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable; emulator regression cannot run."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-provider: basic

      - name: Run managed-device instrumentation regression
        run: ./gradlew --no-daemon pixel2api35DebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-regression-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/reports/androidTests/managedDevice/**
          if-no-files-found: warn
          retention-days: 14
