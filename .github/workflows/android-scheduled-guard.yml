name: Android Scheduled Guard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-scheduled-guard
  cancel-in-progress: true

jobs:
  health-check:
    name: Scheduled Android health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git fsck --no-progress
          large_files="$(find . -type f -not -path './.git/*' -size +100M -print)"
          if [ -n "$large_files" ]; then
            echo "::error::Files larger than 100 MB detected:"
            echo "$large_files"
            exit 1
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate Android project
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload latest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-hourly-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 3
