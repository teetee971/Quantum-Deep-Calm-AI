name: Play Release Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in             ANDROID_UPLOAD_KEYSTORE_BASE64             ANDROID_UPLOAD_STORE_PASSWORD             ANDROID_UPLOAD_KEY_ALIAS             ANDROID_UPLOAD_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/quantum-deep-calm-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quantum-deep-calm-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean lintRelease testDebugUnitTest bundleRelease

      - name: Verify unit tests actually executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced; refusing a false-green release.")

          executed = sum(
              int(ET.parse(report).getroot().attrib.get("tests", "0"))
              for report in reports
          )
          if executed <= 0:
              raise SystemExit("Zero unit tests executed; refusing a false-green release.")

          print(f"Verified {executed} unit test(s) executed before signing.")
          PY

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced."
            exit 1
          fi

          verification_output="$(jarsigner -verify "$AAB" 2>&1)"
          printf '%s\n' "$verification_output"

          if printf '%s\n' "$verification_output" | grep -Fqi 'jar is unsigned'; then
            echo "::error::The release AAB is unsigned."
            exit 1
          fi

          if ! printf '%s\n' "$verification_output" | grep -Fq 'jar verified.'; then
            echo "::error::jarsigner did not confirm a valid signature."
            exit 1
          fi

          echo "SIGNED_AAB=$AAB" >> "$GITHUB_ENV"

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-play-signed-${{ github.sha }}
          path: ${{ env.SIGNED_AAB }}
          if-no-files-found: error
          retention-days: 30
