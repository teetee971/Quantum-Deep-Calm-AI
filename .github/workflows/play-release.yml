name: Play Release Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Require main release ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Signed Play releases are allowed only from refs/heads/main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout SHA mismatch: HEAD=$checked_out_sha GITHUB_SHA=$GITHUB_SHA"
            exit 1
          fi

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable; refusing to sign without managed-device validation."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-provider: basic

      - name: Validate source before signing
        run: ./gradlew --no-daemon clean lintDebug lintRelease testDebugUnitTest assembleDebug

      - name: Verify unit tests actually executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced; refusing a false-green release.")

          executed = 0
          for report in reports:
              root = ET.parse(report).getroot()
              executed += int(root.attrib.get("tests", "0"))

          if executed <= 0:
              raise SystemExit("Zero unit tests executed; refusing a false-green release.")

          print(f"Verified {executed} unit test(s) executed.")
          PY

      - name: Run managed-device release smoke
        run: ./gradlew --no-daemon pixel2api35DebugAndroidTest

      - name: Decode upload keystore
        id: keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/quantum-deep-calm-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced."
            exit 1
          fi
          jarsigner -verify -strict "$AAB"
          echo "SIGNED_AAB=$AAB" >> "$GITHUB_ENV"

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: quantum-deep-calm-ai-play-signed-${{ github.sha }}
          path: ${{ env.SIGNED_AAB }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path="${{ steps.keystore.outputs.path }}"
          if [ -n "$path" ]; then
            rm -f -- "$path"
          fi
