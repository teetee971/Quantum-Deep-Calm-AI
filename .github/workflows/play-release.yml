name: Play Release Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Google Play AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in             ANDROID_UPLOAD_KEYSTORE_BASE64             ANDROID_UPLOAD_STORE_PASSWORD             ANDROID_UPLOAD_KEY_ALIAS             ANDROID_UPLOAD_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Decode upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/quantum-deep-calm-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        run: ./gradlew --no-daemon clean lintRelease testDebugUnitTest bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB was produced."
            exit 1
          fi
          jarsigner -verify -strict "$AAB"
          echo "SIGNED_AAB=$AAB" >> "$GITHUB_ENV"

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-play-signed-${{ github.sha }}
          path: ${{ env.SIGNED_AAB }}
          if-no-files-found: error
          retention-days: 30
