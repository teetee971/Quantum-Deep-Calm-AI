name: Bootstrap Gradle Wrapper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Gradle 9.6 wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate pinned wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Verify wrapper files
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-9.6.0-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Upload wrapper bundle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.6
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 1
