name: Owner Qualified Auto Merge

on:
  workflow_run:
    workflows:
      - Android CI
      - CodeQL Android
      - Repo Guard
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: owner-qualified-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-qualified-owner-pr:
    name: Merge qualified owner PR
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact-head qualification and merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="$GITHUB_REPOSITORY_OWNER"

          pr_number="$(
            gh api "/repos/$repo/pulls?state=open&base=main&head=$owner:$HEAD_BRANCH&per_page=100" \
              --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" \
              | head -n 1
          )"

          if [ -z "$pr_number" ]; then
            echo "No matching open pull request for exact head $HEAD_SHA; nothing to merge."
            exit 0
          fi

          pr_json="$(gh api "/repos/$repo/pulls/$pr_number")"

          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"

          test "$author" = "$owner" || {
            echo "PR #$pr_number is not owned by repository owner $owner; auto-merge refused."
            exit 0
          }
          test "$head_repo" = "$repo" || {
            echo "PR #$pr_number does not originate from the same repository; auto-merge refused."
            exit 0
          }
          test "$head_sha" = "$HEAD_SHA" || {
            echo "PR #$pr_number head moved; auto-merge refused."
            exit 0
          }
          test "$base_ref" = "main" || {
            echo "PR #$pr_number does not target main; auto-merge refused."
            exit 0
          }
          test "$draft" = "false" || {
            echo "PR #$pr_number is still draft; auto-merge refused."
            exit 0
          }

          changed_files="$(gh api --paginate "/repos/$repo/pulls/$pr_number/files?per_page=100" --jq '.[].filename')"
          protected_policy_files='^\.github/workflows/(owner-qualified-auto-merge|android-ci|codeql-android|repo-guard)\.yml$'
          if grep -Eq "$protected_policy_files" <<<"$changed_files"; then
            echo "PR #$pr_number changes a protected qualification/merge-policy workflow."
            echo "Automatic merge is intentionally refused for this trust-boundary change."
            exit 0
          fi

          require_workflow_success() {
            local workflow_file="$1"
            local workflow_name="$2"
            local status conclusion run_sha

            read -r status conclusion run_sha < <(
              gh api "/repos/$repo/actions/workflows/$workflow_file/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" \
                --jq '.workflow_runs[0] | [.status, (.conclusion // ""), .head_sha] | @tsv'
            )

            if [ "$run_sha" != "$HEAD_SHA" ] || [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              echo "$workflow_name is not successful on exact head $HEAD_SHA: status=$status conclusion=$conclusion run_sha=$run_sha"
              return 1
            fi

            echo "$workflow_name: success on $HEAD_SHA"
          }

          require_workflow_success "android-ci.yml" "Android CI"
          require_workflow_success "codeql-android.yml" "CodeQL Android"
          require_workflow_success "repo-guard.yml" "Repo Guard"

          for attempt in 1 2 3 4 5; do
            mergeable="$(gh api "/repos/$repo/pulls/$pr_number" --jq '.mergeable')"
            if [ "$mergeable" = "true" ]; then
              gh pr merge "$pr_number" --repo "$repo" --squash --delete-branch
              echo "PR #$pr_number merged after exact-head automated qualification."
              exit 0
            fi
            if [ "$mergeable" = "false" ]; then
              echo "PR #$pr_number is not mergeable; automatic merge refused."
              exit 0
            fi
            sleep 5
          done

          echo "GitHub did not resolve mergeability in time; leaving PR open rather than bypassing safety."
          exit 0
