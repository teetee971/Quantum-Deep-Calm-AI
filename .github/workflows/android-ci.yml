name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    name: Repository gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repository integrity and zero-debt gate
        shell: bash
        run: |
          set -euo pipefail

          large_files="$(find . -type f -not -path './.git/*' -size +100M -print)"
          if [ -n "$large_files" ]; then
            echo "::error::Files larger than 100 MB are not allowed:"
            echo "$large_files"
            exit 1
          fi

          placeholder_pattern="Contenu"" simulé"
          if grep -RIl --exclude-dir=.git -- "$placeholder_pattern" . >/tmp/placeholders.txt 2>/dev/null; then
            echo "::error::Legacy placeholder files are forbidden:"
            cat /tmp/placeholders.txt
            exit 1
          fi

          if grep -RInE --exclude-dir=build --exclude-dir=.gradle '\b(TODO|FIXME|HACK|XXX)\b' app/src/main >/tmp/debt-markers.txt 2>/dev/null; then
            echo "::error::Source debt markers are forbidden in app/src/main:"
            cat /tmp/debt-markers.txt
            exit 1
          fi

          git diff --check

      - name: Verify Google Play target API
        shell: bash
        run: |
          set -euo pipefail
          target_sdk="$(sed -nE 's/^[[:space:]]*targetSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$target_sdk" ]; then
            echo "::error::Unable to read targetSdk from app/build.gradle.kts"
            exit 1
          fi
          if [ "$target_sdk" -lt 36 ]; then
            echo "::error::Google Play submissions require targetSdk 36+ from 2026-08-31. Found: $target_sdk"
            exit 1
          fi
          echo "targetSdk=$target_sdk"

  android-build:
    name: Android build + Play bundle
    needs: repository-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-9.6.0-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint, unit tests, debug APK and release AAB
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug bundleRelease

      - name: Verify unit tests actually executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced; refusing a false-green test job.")

          executed = 0
          for report in reports:
              root = ET.parse(report).getroot()
              executed += int(root.attrib.get("tests", "0"))

          if executed <= 0:
              raise SystemExit("Zero unit tests executed; refusing a false-green test job.")

          print(f"Verified {executed} unit test(s) executed.")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-debug-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-release-bundle-${{ github.sha }}
          path: '**/build/outputs/bundle/release/*.aab'
          if-no-files-found: error
          retention-days: 14
