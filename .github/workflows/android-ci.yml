name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    name: Repository gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject files larger than 100 MB
        shell: bash
        run: |
          set -euo pipefail
          large_files="$(find . -type f -not -path './.git/*' -size +100M -print)"
          if [ -n "$large_files" ]; then
            echo "::error::Files larger than 100 MB are not allowed:"
            echo "$large_files"
            exit 1
          fi

      - name: Report placeholder legacy files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl --exclude-dir=.git -- 'Contenu simulé' . >/tmp/placeholders.txt 2>/dev/null; then
            echo "::warning::Legacy placeholder files still exist and must be removed during Android migration."
            cat /tmp/placeholders.txt
          fi

  android-build:
    name: Android build
    needs: repository-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "::error::Native Android project scaffold is missing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint, unit tests and debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deep-calm-ai-debug-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
