name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    name: Repository gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Repository integrity and zero-debt gate
        shell: bash
        run: |
          set -euo pipefail

          large_files="$(find . -type f -not -path './.git/*' -size +100M -print)"
          if [ -n "$large_files" ]; then
            echo "::error::Files larger than 100 MB are not allowed:"
            echo "$large_files"
            exit 1
          fi

          placeholder_pattern="Contenu"" simulé"
          if grep -RIl --exclude-dir=.git -- "$placeholder_pattern" . >/tmp/placeholders.txt 2>/dev/null; then
            echo "::error::Legacy placeholder files are forbidden:"
            cat /tmp/placeholders.txt
            exit 1
          fi

          if grep -RInE --exclude-dir=build --exclude-dir=.gradle '\b(TODO|FIXME|HACK|XXX)\b' app/src/main >/tmp/debt-markers.txt 2>/dev/null; then
            echo "::error::Source debt markers are forbidden in app/src/main:"
            cat /tmp/debt-markers.txt
            exit 1
          fi

          git diff --check

      - name: Verify Android SDK policy
        shell: bash
        run: |
          set -euo pipefail
          min_sdk="$(sed -nE 's/^[[:space:]]*minSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          target_sdk="$(sed -nE 's/^[[:space:]]*targetSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$min_sdk" ] || [ -z "$target_sdk" ]; then
            echo "::error::Unable to read minSdk/targetSdk from app/build.gradle.kts"
            exit 1
          fi
          if [ "$min_sdk" -ne 26 ]; then
            echo "::error::Qualification matrix is anchored to the product minSdk 26. Found minSdk=$min_sdk"
            exit 1
          fi
          if [ "$target_sdk" -lt 36 ]; then
            echo "::error::Google Play submissions require targetSdk 36+. Found: $target_sdk"
            exit 1
          fi

          echo "minSdk=$min_sdk"
          echo "targetSdk=$target_sdk"

  android-build:
    name: Android build + Play bundle
    needs: repository-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-9.8.0-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-provider: basic

      - name: Lint, unit tests, debug APK and release AAB
        run: ./gradlew --no-daemon lintDebug lintRelease testDebugUnitTest assembleDebug bundleRelease

      - name: Verify unit tests actually executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced; refusing a false-green test job.")

          executed = 0
          for report in reports:
              root = ET.parse(report).getroot()
              executed += int(root.attrib.get("tests", "0"))

          if executed <= 0:
              raise SystemExit("Zero unit tests executed; refusing a false-green test job.")

          print(f"Verified {executed} unit test(s) executed.")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: quantum-deep-calm-ai-debug-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: quantum-deep-calm-ai-release-bundle-${{ github.sha }}
          path: '**/build/outputs/bundle/release/*.aab'
          if-no-files-found: error
          retention-days: 14

  emulator-qualification:
    name: Emulator qualification (API ${{ matrix.api }})
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 36, 37]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable; emulator qualification cannot be trusted on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and managed-device image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-${{ matrix.api }};default;x86_64"

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-provider: basic

      - name: Run complete managed-device instrumentation suite
        run: ./gradlew --no-daemon "pixel2api${{ matrix.api }}DebugAndroidTest"

      - name: Verify instrumentation tests actually executed
        shell: bash
        env:
          QUALIFICATION_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          api = os.environ["QUALIFICATION_API"]
          roots = [
              Path("app/build/outputs/androidTest-results/managedDevice"),
              Path("app/build/outputs/androidTest-results/managedDevice/debug"),
          ]
          reports = []
          for root in roots:
              if root.exists():
                  reports.extend(root.rglob("TEST-*.xml"))

          unique_reports = sorted(set(reports))
          if not unique_reports:
              raise SystemExit(f"No managed-device JUnit XML reports were produced for API {api}; refusing false-green qualification.")

          executed = 0
          failures = 0
          errors = 0
          for report in unique_reports:
              suite = ET.parse(report).getroot()
              executed += int(suite.attrib.get("tests", "0"))
              failures += int(suite.attrib.get("failures", "0"))
              errors += int(suite.attrib.get("errors", "0"))

          if executed <= 0:
              raise SystemExit(f"Zero instrumentation tests executed on API {api}; refusing false-green qualification.")
          if failures or errors:
              raise SystemExit(f"API {api} instrumentation reports contain failures={failures}, errors={errors}.")

          print(f"Verified {executed} managed-device instrumentation test(s) on API {api}.")
          PY

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-developer-qualification-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/reports/androidTests/managedDevice/**
          if-no-files-found: error
          retention-days: 14

  developer-qualification:
    name: Android developer qualification
    if: always()
    needs:
      - repository-gate
      - android-build
      - emulator-qualification
    runs-on: ubuntu-latest
    env:
      REPOSITORY_RESULT: ${{ needs.repository-gate.result }}
      BUILD_RESULT: ${{ needs.android-build.result }}
      EMULATOR_RESULT: ${{ needs.emulator-qualification.result }}
    steps:
      - name: Enforce emulator-first qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$EMULATOR_RESULT" = "success"

          {
            echo '## Android developer qualification'
            echo ''
            echo '- Repository integrity / zero-debt gate: PASS'
            echo '- Android lint and unit tests: PASS'
            echo '- Debug APK build: PASS'
            echo '- Release AAB build: PASS'
            echo '- Managed emulator API 26 (product minSdk): PASS'
            echo '- Managed emulator API 29 (legacy/intermediate checkpoint): PASS'
            echo '- Managed emulator API 36 (modern Android behavior): PASS'
            echo '- Managed emulator API 37 (latest Android compatibility): PASS'
            echo '- compileSdk/targetSdk 37 build validation: PASS'
            echo ''
            echo 'This is the primary developer qualification boundary.'
            echo 'Manual owner validation is not required to repeat CI-verifiable checks.'
            echo 'Physical-device review remains separate for hardware/OEM behavior that an emulator cannot prove.'
          } >> "$GITHUB_STEP_SUMMARY"
